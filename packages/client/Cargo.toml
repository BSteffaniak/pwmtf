[package]
authors     = { workspace = true }
categories  = ["games", "wasm"]
description = "Bevy browser client for Pool with More Than Friends"
edition     = { workspace = true }
keywords    = ["bevy", "billiards", "game", "pool", "wasm"]
license     = { workspace = true }
name        = "pwmtf_client"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[[bin]]
name = "pwmtf-client"
path = "src/main.rs"

[dependencies]
bevy              = { workspace = true }
pwmtf_billiards = { path = "../billiards", version = "0.1.0" }
pwmtf_eight_ball = { path = "../eight_ball", version = "0.1.0" }
pwmtf_protocol    = { path = "../protocol", version = "0.1.0" }
thiserror         = { workspace = true }

[dev-dependencies]
futures-lite = { workspace = true }
pwmtf_server = { path = "../server", version = "0.1.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3.104", default-features = false }
wasm-bindgen = { version = "0.2.127", default-features = false }
web-sys = { workspace = true, features = [
    "BinaryType",
    "CloseEvent",
    "Crypto",
    "Event",
    "MessageEvent",
    "Performance",
    "WebSocket",
    "Window",
] }

[features]
default          = []
fail-on-warnings = []
