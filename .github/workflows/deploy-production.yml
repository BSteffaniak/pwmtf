name: Deploy Production

"on":
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

# Builds are independent; only the production mutation job is serialized.
jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 60
    outputs:
      image: ${{ steps.image.outputs.image }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master 2026-04-08 (node24)
        with:
          version: 0.4.107
      - name: Build and push without releasing
        env:
          IMAGE_TAG: build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test -n "$FLY_API_TOKEN"
          flyctl deploy --app pwmtf --remote-only --build-only --push --image-label "$IMAGE_TAG"
      - name: Record prepared image tag
        id: image
        env:
          IMAGE_TAG: build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          echo "image=registry.fly.io/pwmtf:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Prepared registry.fly.io/pwmtf:$IMAGE_TAG for $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  approve:
    needs: build
    runs-on: ubuntu-latest
    environment: production-approval
    timeout-minutes: 5
    steps:
      - run: echo "Approved PWMTF production deployment"

  deploy:
    needs: [approve, build]
    concurrency:
      group: production-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 60
    env:
      PWMTF_DEPLOY_IMAGE: ${{ needs.build.outputs.image }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      PWMTF_GOOGLE_CLIENT_ID: ${{ secrets.PWMTF_GOOGLE_CLIENT_ID }}
      PWMTF_GOOGLE_CLIENT_SECRET: ${{ secrets.PWMTF_GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master 2026-04-08 (node24)
        with:
          version: 0.4.107
      - name: Assert protected credentials
        run: |
          test -n "$FLY_API_TOKEN"
          test -n "$PWMTF_GOOGLE_CLIENT_ID"
          test -n "$PWMTF_GOOGLE_CLIENT_SECRET"
      - name: Install operational tools
        run: sudo apt-get update && sudo apt-get install --yes jq
      - name: Snapshot existing production database
        run: python3 scripts/snapshot-production.py
      - name: Deploy one authoritative Machine
        run: ./scripts/deploy-production.sh
