# cargo-deny configuration for PWMTF.

[advisories]
ignore = [
    # Bevy 0.19.1 -> winit 0.30.13 -> sctk-adwaita -> ab_glyph.
    # No safe upgrade exists as of 2026-08-16; this is unmaintained metadata,
    # not a vulnerability. Remove when the Bevy/winit chain migrates.
    "RUSTSEC-2026-0192",
    # openidconnect 4.0.1 includes rsa 0.9 for signed ID-token algorithms.
    # PWMTF only verifies provider signatures with public keys and performs no RSA
    # private-key operation, so the private-key timing recovery attack is
    # unreachable. Remove when openidconnect migrates to a fixed RSA line.
    "RUSTSEC-2023-0071",
    # openidconnect 4.0.1 -> p256/p384 -> elliptic-curve 0.13 -> crypto-bigint 0.5.
    # PWMTF only verifies provider ECDSA signatures over public data with public
    # keys, so no secret integer reaches the affected arithmetic. No semver-
    # compatible fix exists on the 0.5 line. Remove when openidconnect migrates.
    "RUSTSEC-2026-0387",
    # switchy_schema 0.4.0 -> moosicbox_json_utils -> switchy_database ->
    # moosicbox_profiles(api) -> actix-web -> actix-http -> h2 0.3.27.
    # PWMTF enables Switchy code/schema and simulator builders only and does not
    # expose this transitive Actix HTTP/2 stack. Remove when Switchy decouples
    # schema JSON utilities from the profile API or upgrades its h2 line.
    "RUSTSEC-2026-0258",
]
version = 2
yanked = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
version = 2

[bans]
multiple-versions = "allow"
wildcards         = "deny"

[sources]
allow-git        = []
unknown-git      = "deny"
unknown-registry = "deny"
